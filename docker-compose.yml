version: '3.8'

services:
  # 1. High-Availability Spatial Database Engine
  sar-db:
    image: postgis/postgis:15-3.3-alpine
    container_name: sar-postgis-db
    environment:
      POSTGRES_USER: sar_admin
      POSTGRES_PASSWORD: SecretRescuePassword123!
      POSTGRES_DB: sar_mission_control
    ports:
      - "5432:5432"
    volumes:
      - sar_db_fresh_data:/var/lib/postgresql/data
    networks:
      - sar-rescue-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sar_admin -d sar_mission_control"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Inter-Agent Shared Mission State Cache
  sar-cache:
    image: redis:7-alpine
    container_name: sar-redis-cache
    ports:
      - "6379:6379"
    volumes:
      - sar_cache_data:/data
    networks:
      - sar-rescue-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Apache Kafka Metadata Coordinator
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: sar-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - sar-rescue-network

    # 4. Ingress Event Bus Message Broker Cluster Node
  sar-broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sar-kafka-broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      # Ensures both port mappings match the cluster container name 'sar-kafka-broker'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,PLAINTEXT_INTERNAL://sar-kafka-broker:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - sar-rescue-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "127.0.0.1:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
  #Local LLM Compute Tier Engine Node
  sar-llm-compute:
    image: ollama/ollama:latest
    container_name: sar-ollama-engine
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    networks:
      - sar-rescue-network
    environment:
    - OLLAMA_KEEP_ALIVE=30m
    restart: always
  # 5. Continuous Edge Ingestion Worker Daemon Service
  sar-ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: sar-ingestion-worker
    depends_on:
      sar-db:
        condition: service_healthy
      sar-broker:
        condition: service_healthy
      sar-llm-compute: # Wait for the LLM container to start up cleanly
        condition: service_started
    # Mount local directories so your application container writes JSON files directly to your windows workspace folder!
    volumes:
      - .:/app
    networks:
      - sar-rescue-network
    restart: always

  # 6. Command Center Visual Interface Console UI
  sar-operator-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: sar-operator-dashboard
    ports:
      - "8501:8501" # EXPLICITLY MAPS PORT INTERFACE TO WINDOWS LOCALHOST
    depends_on:
      sar-db:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - sar-rescue-network
    restart: always

networks:
  sar-rescue-network:
    driver: bridge # ENFORCES THE STABLE ISOLATED WINDOWS NETWORK ALIAS BRIDGE LAYER

volumes:
  sar_db_fresh_data:
  sar_cache_data:
  ollama_storage: # Shared volume to keep downloaded models cached on your host disk